<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma super app de révision</title>
    <link rel="manifest" href="manifest.json">
    <!-- Icône pour l'écran d'accueil sur iPhone / iPad -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Indicateur et barre de progression -->
    <div class="progress-container">
        <span id="compteur-cartes">0 / 0</span>
        <div class="barre-fond">
            <div id="barre-progression" class="barre-remplissage"></div>
        </div>
    </div>

    <div class="app-container">
        <h1>Mes Flashcards</h1>

        <!-- Filtre de matières -->
        <div class="select-matiere">
            <label for="filtre-matiere">📚 Matière :</label>
            <select id="filtre-matiere">
                <option value="Toutes">Toutes les matières</option>
            </select>
        </div>

        <p id="compteur">Carte 1 / 3</p>

        <!-- Carte 3D -->
        <div class="carte-container">
            <div class="carte" id="carte">
                <div class="carte-face carte-recto">
                    <span class="badge" id="badge-matiere">Question</span>
                    <p class="question">Chargement...</p>
                    <span class="hint">🔄 Clique sur la carte pour retourner</span>
                </div>
                <div class="carte-face carte-verso">
                    <span class="badge badge-reponse">Réponse</span>
                    <p class="reponse">Chargement...</p>
                </div>
            </div>
        </div>

        <!-- Boutons -->
        <div class="actions-carte">
            <button id="btn-reponse" class="btn btn-primaire">🔄 Retourner</button>
            <button id="btn-supprimer" class="btn btn-danger">🗑️ Supprimer</button>
        </div>

        <div class="navigation">
            <button id="btn-precedents" class="btn btn-secondaire">⬅️ Précédent</button>
            <button id="btn-melanger" class="btn btn-secondaire">🔀 Mélanger</button>
            <button id="btn-suivant" class="btn btn-secondaire">Suivant ➡️</button>
        </div>

        <!-- Formulaire d'ajout avec matière -->
        <div class="formulaire">
            <h3>Ajouter une carte</h3>
            <input type="text" id="nouvelle-matiere" placeholder="Matière (ex: Maths, Histoire, Anglais...)">
            <input type="text" id="nouvelle-question" placeholder="Question">
            <input type="text" id="nouvelle-reponse" placeholder="Réponse">
            <button id="btn-ajouter" class="btn btn-succes">➕ Ajouter au paquet</button>
        </div>
    </div>

    <script src="script.js?v=2"></script>

</body>

</html>
