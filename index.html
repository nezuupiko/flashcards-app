<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma super app de révision</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png?v=2">
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <h1>Mes Flashcards</h1>

        <!-- Filtre de matières -->
        <div class="select-matiere">
            <label for="filtre-matiere">📚 Matière :</label>
            <select id="filtre-matiere">
                <option value="Toutes">Toutes les matières</option>
            </select>
        </div>

        <!-- Indicateur et barre de progression -->
        <div class="progress-container">
            <span id="compteur-cartes">0 / 0</span>
            <div class="barre-fond">
                <div id="barre-progression" class="barre-remplissage"></div>
            </div>
        </div>

        <!-- Carte 3D -->
        <div class="carte-container">
            <div class="carte" id="carte">
                <div class="carte-face carte-recto">
                    <span class="badge" id="badge-matiere">Question</span>
                    <p class="question">Chargement...</p>
                    <span class="hint">🔄 Clique sur la carte pour retourner</span>
                </div>
                <div class="carte-face carte-verso">
                    <span class="badge badge-reponse">Réponse</span>
                    <p class="reponse">Chargement...</p>
                </div>
            </div>
        </div>

        <!-- Boutons de contrôle -->
        <div class="actions-carte">
            <button id="btn-reponse" class="btn btn-primaire">🔄 Retourner</button>
            <button id="btn-supprimer" class="btn btn-danger">🗑️ Supprimer</button>
        </div>

        <div class="navigation">
            <button id="btn-precedents" class="btn btn-secondaire">⬅️ Précédent</button>
            <button id="btn-melanger" class="btn btn-secondaire">🔀 Mélanger</button>
            <button id="btn-suivant" class="btn btn-secondaire">Suivant ➡️</button>
        </div>

        <!-- Formulaires séparés en bas -->
        <section class="formulaires-container">

            <!-- Formulaire 1 : Créer une Matière -->
            <form id="form-matiere" class="form-box">
                <h3>Nouvelle Matière</h3>
                <input type="text" id="nom-nouvelle-matiere" placeholder="Nom de la matière (ex: Anglais)" required>
                <button type="submit" class="btn btn-primaire">Créer la matière</button>
            </form>

            <!-- Formulaire 2 : Créer une Carte -->
            <form id="form-carte" class="form-box">
                <h3>Nouvelle Carte</h3>
                <select id="select-matiere-carte" required>
                    <option value="">-- Choisir une matière --</option>
                </select>
                <input type="text" id="question-carte" placeholder="Question" required>
                <input type="text" id="reponse-carte" placeholder="Réponse" required>
                <button type="submit" class="btn btn-succes">➕ Ajouter la carte</button>
            </form>

        </section>
    </div>

    <script src="script.js?v=3"></script>

</body>

</html>
