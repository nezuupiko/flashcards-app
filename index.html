<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma super app de révision</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Mes Flashcards</h1>

    <!-- Compteur -->
    <p id="compteur">Carte 1 / 3</p>

    <!-- La carte -->
    <div class="carte">
        <p class="question">Chargement...</p>
        <p class="reponse">Chargement...</p>
    </div>

    <!-- Boutons liés à la carte courante -->
    <button id="btn-reponse">Afficher la réponse</button>
    <button id="btn-supprimer">🗑️ Supprimer cette carte</button>

    <!-- Zone de navigation -->
    <div class="navigation">
        <button id="btn-precedents">Précédent</button>
        <button id="btn-melanger">🔀 Mélanger</button>
        <button id="btn-suivant">Suivant</button>
    </div>

    <!-- Formulaire d'ajout -->
    <div class="formulaire">
        <h3>Ajouter une nouvelle carte</h3>
        <input type="text" id="nouvelle-question" placeholder="Question (ex: Capitale de l'Espagne ?)">
        <input type="text" id="nouvelle-reponse" placeholder="Réponse (ex: Madrid)">
        <button id="btn-ajouter">Ajouter la carte</button>
    </div>

    <!-- Le script chargé à la toute fin -->
    <script src="script.js"></script>

</body>
</html>
